[project]
name = "ado-happyfox-integration"
version = "0.1.0"
description = "Bidirectional integration between Azure DevOps and HappyFox Help Desk"
requires-python = ">=3.11"
dependencies = [
    "azure-functions>=1.21.0,<2.0",
    "azure-servicebus>=7.12.0,<8.0",
    "azure-data-tables>=12.5.0,<13.0",
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "tenacity>=9.0.0,<10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-cov>=6.0.0,<7.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "ruff>=0.8.0,<1.0",
    "mypy>=1.13.0,<2.0",
    "respx>=0.22.0,<1.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
